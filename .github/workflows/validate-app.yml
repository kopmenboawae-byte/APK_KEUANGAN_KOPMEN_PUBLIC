name: Validate HTML application

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/validate-app.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/validate-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract inline scripts
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, re.I | re.S)
          if not scripts:
              raise SystemExit("Tidak ditemukan inline JavaScript untuk diperiksa")
          out = Path("/tmp/kopmen-inline")
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts, 1):
              (out / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"Inline script ditemukan: {len(scripts)}")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/kopmen-inline/*.js; do
            echo "Memeriksa $file"
            node --check "$file"
          done
          echo "Semua inline JavaScript lolos pemeriksaan sintaks."

      - name: Test ledger journal validator
        run: node tests/ledger-engine.test.cjs

      - name: Test import staging with IndexedDB
        run: |
          npm install --no-save --package-lock=false fake-indexeddb@6.2.4
          node tests/import-staging.test.cjs

      - name: Test legacy ledger migration rules
        run: node tests/legacy-migration.test.cjs
